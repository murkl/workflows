# The pinned actions of the workflow and of each action, bumped as a pull
# request CI can check. Releases wait 7 days, since a compromised one is
# usually pulled by then.

version: 2

updates:
  - package-ecosystem: github-actions
    directories: ["/", "/notes"]
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
